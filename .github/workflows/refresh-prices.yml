name: Price refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRIXLY_URL: ${{ vars.PRIXLY_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRIXLY_URL/api/cron/refresh"
