# Relevé des prix suivis en production (Vercel Hobby : le cron Vercel ne tourne qu'une fois par jour).
# Chaque appel relève un lot de produits dus dans la limite de temps d'une fonction ; les suivants attendent l'appel d'après.
# À configurer dans le dépôt GitHub : secret CRON_SECRET (même valeur que sur Vercel), variable PRIXLY_URL (https://….vercel.app).
# Les horaires GitHub sont approximatifs (retards de plusieurs minutes) : ça sert aussi de jitter.
name: Relevé des prix

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/cron/refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRIXLY_URL: ${{ vars.PRIXLY_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRIXLY_URL/api/cron/refresh"
